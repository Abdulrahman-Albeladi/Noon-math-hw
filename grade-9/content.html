<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثالث متوسط | اختر نوع المحتوى</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#15201c;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:34px 18px}.topbar{margin-bottom:14px}.back{display:inline-block;color:#174f41;text-decoration:none;font-weight:700;background:#fff;border:1px solid #cde9df;border-radius:9px;padding:9px 13px}.hero{background:#fff;border:1px solid #cde9df;border-top:7px solid #26b78a;border-radius:14px;padding:28px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.04);text-align:center}h1{margin:0 0 7px;font-size:29px}.sub{color:#52645d;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{display:block;background:#fff;border:1px solid #cde9df;border-radius:14px;padding:28px 20px;text-decoration:none;color:#15201c;text-align:center;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:#8fd6c0;box-shadow:0 7px 22px rgba(0,0,0,.06)}.choice h2{margin:0 0 8px;font-size:23px}.label{color:#64756e;font-size:14px;margin-bottom:16px}.go{display:inline-block;background:#26b78a;color:#fff;border-radius:8px;padding:9px 15px;font-weight:700;font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding-top:24px}}</style></head><body><main class="wrap"><div class="topbar"><a class="back" href="../index.html">العودة لاختيار الصف</a></div><section class="hero"><h1>ثالث متوسط</h1><div class="sub">اختر نوع المحتوى</div></section><section class="grid"><a class="choice" href="index.html"><h2>أنشطة تدريبية</h2><div class="label">للرياضيات فقط</div><span class="go">عرض الأنشطة التدريبية</span></a><a class="choice" href="worksheets/index.html"><h2>أوراق العمل</h2><div class="label">للاستعداد للاختبارات</div><span class="go">عرض أوراق العمل</span></a></section></main><script>const h=location.hash;if(h){document.querySelectorAll('a[href]').forEach(a=>{const x=a.getAttribute('href');if(x&&x.endsWith('.html'))a.href=x+h;});}</script></body></html>

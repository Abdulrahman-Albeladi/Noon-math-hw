<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الصف العاشر - المجموعة الكاملة - بنك الإجابات</title><link rel="icon" type="image/svg+xml" href="../assets/noon-favicon.svg"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ececec}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="sheet" title="الصف العاشر - المجموعة الكاملة - بنك الإجابات"></iframe><script>
(()=>{
  const frame=document.getElementById('sheet');
  frame.src='answers.html'+location.hash;
  const addScript=(d,src)=>new Promise((resolve,reject)=>{const s=d.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)});
  frame.addEventListener('load',async()=>{
    const d=frame.contentDocument;if(!d||d.body.dataset.collabInjected)return;
    d.body.dataset.collabInjected='1';d.body.dataset.docId='g10-full-answers';
    const link=d.createElement('link');link.rel='stylesheet';link.href='../assets/collab.css';d.head.appendChild(link);
    let n=0;const mark=el=>{if(!el.hasAttribute('data-field')&&!el.closest('[data-field]'))el.dataset.field=`full-a-${++n}`};
    d.querySelectorAll('.cover-title,.cover-sub,.ab-title,.ab-sub,.lesson-title,.info td').forEach(mark);
    d.querySelectorAll('.ab-table td').forEach(el=>{if(!el.classList.contains('n'))mark(el)});
    try{await addScript(d,'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');await addScript(d,'https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js');await addScript(d,'../assets/config.js');await addScript(d,'../assets/collab.js')}catch(e){console.error(e)}
  });
})();
</script></body></html>

name: Import Grade 9 science worksheet
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-grade9-science.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-science-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact PDF from noon-worksheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p grade-9/worksheets/science
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Abdulrahman-Albeladi/noon-worksheets/94f55cc207d9b530c33654f0dc34e714a31077c9/grade-9/science/worksheet-1.pdf" \
            -o grade-9/worksheets/science/worksheet-1.pdf
          actual="$(git hash-object grade-9/worksheets/science/worksheet-1.pdf)"
          test "$actual" = "bacb2f716b11a4d0769b487926b1af9dcb36846e"
      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch grade-9/worksheets/science/worksheet-1.pdf >/dev/null 2>&1 \
             && git diff --quiet -- grade-9/worksheets/science/worksheet-1.pdf; then
            echo "Science PDF already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade-9/worksheets/science/worksheet-1.pdf
          git commit -m "Add updated Grade 9 science worksheet"
          git push origin HEAD:main

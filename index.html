<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أنشطة تدريبية في الرياضيات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f6;color:#15201c;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:42px 18px}
.hero{background:#fff;border:1px solid #cde9df;border-top:7px solid #26b78a;border-radius:14px;padding:30px 28px;margin-bottom:22px;box-shadow:0 4px 18px rgba(0,0,0,.04);text-align:center}
h1{margin:0 0 8px;font-size:30px}
.sub{color:#52645d;line-height:1.7;font-size:16px}
.grade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grade-card{display:block;background:#fff;border:1px solid #cde9df;border-radius:14px;padding:30px 24px;text-decoration:none;color:#15201c;box-shadow:0 4px 16px rgba(0,0,0,.035);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;text-align:center}
.grade-card:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(0,0,0,.07);border-color:#8fd6c0}
.grade-card h2{margin:0 0 8px;font-size:24px}
.grade-card .label{color:#64756e;font-size:14px;margin-bottom:18px}
.grade-card .go{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 18px;border-radius:999px;background:#26b78a;color:#fff;font-weight:800;font-size:14px}
@media(max-width:700px){.wrap{padding-top:24px}.grade-grid{grid-template-columns:1fr}.hero{padding:24px 20px}h1{font-size:26px}.grade-card{padding:24px 18px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<h1>أنشطة تدريبية في الرياضيات</h1>
<div class="sub">اختر صفك لعرض الأنشطة التدريبية المناسبة لك.</div>
</section>
<section class="grade-grid">
<a class="grade-card" href="grade-9/index.html"><h2>ثالث متوسط</h2><div class="label">الصف الثالث المتوسط</div><span class="go">عرض الأنشطة التدريبية</span></a>
<a class="grade-card" href="grade-10/index.html"><h2>أول ثانوي</h2><div class="label">الصف الأول الثانوي</div><span class="go">عرض الأنشطة التدريبية</span></a>
<a class="grade-card" href="grade-11/index.html"><h2>ثاني ثانوي</h2><div class="label">الصف الثاني الثانوي</div><span class="go">عرض الأنشطة التدريبية</span></a>
<a class="grade-card" href="grade-12/index.html"><h2>ثالث ثانوي</h2><div class="label">الصف الثالث الثانوي</div><span class="go">عرض الأنشطة التدريبية</span></a>
</section>
</main>
<script>
const h=location.hash;
if(h){document.querySelectorAll('a[href]').forEach(a=>{if(a.getAttribute('href').endsWith('.html'))a.href=a.getAttribute('href')+h;});}
</script>
</body>
</html>

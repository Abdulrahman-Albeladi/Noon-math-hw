<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أوراق العمل والأنشطة التدريبية</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#15201c;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:42px 18px}.topbar{margin-bottom:14px}.back{display:inline-block;color:#174f41;text-decoration:none;font-weight:700;background:#fff;border:1px solid #cde9df;border-radius:9px;padding:9px 13px}.hero{background:#fff;border:1px solid #cde9df;border-top:7px solid #26b78a;border-radius:14px;padding:30px 28px;margin-bottom:22px;box-shadow:0 4px 18px rgba(0,0,0,.04);text-align:center}h1{margin:0 0 8px;font-size:30px}.sub{color:#52645d;line-height:1.7;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{display:block;background:#fff;border:1px solid #cde9df;border-radius:14px;padding:30px 24px;text-decoration:none;color:#15201c;box-shadow:0 4px 16px rgba(0,0,0,.035);transition:.15s;text-align:center}.choice:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(0,0,0,.07);border-color:#8fd6c0}.choice h2{margin:0 0 8px;font-size:24px}.label{color:#64756e;font-size:14px;margin-bottom:18px}.go{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:999px;background:#26b78a;color:#fff;font-weight:800;font-size:14px}.card{background:#fff;border:1px solid #cde9df;border-radius:12px;padding:22px}.settitle{font-weight:800;margin-bottom:12px;line-height:1.7;text-align:center}.links{display:flex;justify-content:center}.links a{background:#26b78a;color:#fff;text-decoration:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px}@media(max-width:700px){.wrap{padding-top:24px}.grid,.grid.three{grid-template-columns:1fr}.hero{padding:24px 20px}h1{font-size:26px}}</style></head><body><main
